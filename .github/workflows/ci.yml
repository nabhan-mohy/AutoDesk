name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests (all hardware/network deps are mocked)
        run: python -m pytest -q --tb=short
      - name: Verify Streamlit app imports cleanly
        run: python -c "import ast,sys; ast.parse(open('app.py',encoding='utf-8').read()); print('app.py parses OK')"
